spring.application.name=adaredi-orders

server.port=${PORT:8080}

# Credentials loaded from project-root .env (see .env.example)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSLMODE}&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Royal Express / Curfox courier API (https://royalexpress.merchant.curfox.com)
curfox.enabled=${CURFOX_ENABLED:true}
curfox.api-base-url=${CURFOX_API_BASE_URL:https://v1.api.curfox.com}
curfox.lists-api-base-url=${CURFOX_LISTS_API_BASE_URL:https://v2-lists.api.curfox.com/api}
curfox.tenant=${CURFOX_TENANT:royalexpress}
curfox.email=${CURFOX_EMAIL:}
curfox.password=${CURFOX_PASSWORD:}
curfox.merchant-business-id=${CURFOX_MERCHANT_BUSINESS_ID:}
curfox.merchant-business-name=${CURFOX_MERCHANT_BUSINESS_NAME:}
curfox.origin-city-name=${CURFOX_ORIGIN_CITY_NAME:}
curfox.origin-state-name=${CURFOX_ORIGIN_STATE_NAME:}
curfox.auto-sync-on-create=${CURFOX_AUTO_SYNC:true}

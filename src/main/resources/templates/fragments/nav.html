<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="sidebar" th:fragment="main" id="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">ADAREDI</span>
                <span class="brand-tagline">Orders &amp; Profit Hub</span>
            </div>
        </div>
        
        <nav class="nav-links" aria-label="Main navigation">
            <div class="nav-section-title">Operations</div>
            
            <a th:href="@{/dashboard}" class="nav-link" id="nav-dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <span>Dashboard</span>
            </a>
            
            <a th:href="@{/orders/new}" class="nav-link" id="nav-new-order">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                <span>New Order</span>
            </a>
            
            <a th:href="@{/orders}" class="nav-link" id="nav-all-orders">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>All Orders</span>
            </a>

            <div class="nav-section-title" style="margin-top: 1.25rem;">Settings</div>

            <a th:href="@{/pricing}" class="nav-link" id="nav-pricing">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    <path d="M12 6v12M9 9h6M9 15h6" opacity="0.3"></path>
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <span>Profit Settings</span>
            </a>
        </nav>

        <div class="sidebar-status-card">
            <span class="status-dot-pulse"></span>
            <div class="sidebar-status-info">
                <span class="sidebar-status-title">System Active</span>
                <span class="sidebar-status-sub">Live Profit Tracking</span>
            </div>
        </div>

        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle color mode" id="theme-toggle-btn">
            <div class="theme-toggle-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="theme-toggle-label">Dark Mode</span>
            </div>
            <div class="theme-switch-track">
                <div class="theme-switch-thumb"></div>
            </div>
        </button>
    </aside>

    <header class="mobile-header" th:fragment="mobile-header">
        <div class="brand" style="border: none; padding: 0; margin: 0;">
            <div class="brand-icon" style="width: 32px; height: 32px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <span class="brand-name" style="font-size: 1rem;">ADAREDI</span>
        </div>
        <button type="button" class="btn secondary" onclick="document.getElementById('sidebar').classList.toggle('open')" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            Menu
        </button>
    </header>
</body>
</html>

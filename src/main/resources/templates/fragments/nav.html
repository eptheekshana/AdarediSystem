<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside class="sidebar" th:fragment="main" id="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">ADAREDI.COM</span>
                <span class="brand-tagline">Orders &amp; Profit Tracker</span>
            </div>
        </div>
        
        <nav class="nav-links" aria-label="Main navigation">
            <a th:href="@{/dashboard}" class="nav-link" id="nav-dashboard">
                <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
                Dashboard
            </a>
            <a th:href="@{/orders/new}" class="nav-link" id="nav-new-order">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                New Order
            </a>
            <a th:href="@{/orders}" class="nav-link" id="nav-all-orders">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                All Orders
            </a>
        </nav>

        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode" id="theme-toggle-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <span class="theme-toggle-label">Toggle theme</span>
        </button>
    </aside>

    <header class="mobile-header" th:fragment="mobile-header">
        <div class="brand" style="margin-bottom: 0;">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <span class="brand-name">ADAREDI</span>
        </div>
        <button type="button" class="btn secondary" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button>
    </header>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ADAREDI.COM — Page not found</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        (function () {
            try {
                const stored = localStorage.getItem('bedsheet-theme');
                const theme = stored === 'dark' || stored === 'light'
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>
</head>
<body>
<div th:replace="~{fragments/nav :: main}"></div>
<main class="container page-shell">
    <section class="card">
        <h2>Page not found (404)</h2>
        <p>This URL is not mapped. Use one of these:</p>
        <ul>
            <li><a th:href="@{/dashboard}">/dashboard</a> — analytics</li>
            <li><a th:href="@{/orders/new}">/orders/new</a> — create order</li>
            <li><a th:href="@{/orders}">/orders</a> — list orders</li>
        </ul>
    </section>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

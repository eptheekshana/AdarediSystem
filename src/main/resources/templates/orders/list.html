<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAREDI.COM - Orders</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        (function () {
            try {
                const stored = localStorage.getItem('bedsheet-theme');
                const theme = stored === 'dark' || stored === 'light'
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/nav :: main}"></div>
    
    <div class="main-content">
        <div th:replace="~{fragments/nav :: mobile-header}"></div>
        
        <main class="container">
            <div class="dash-header">
                <div class="dash-header-left">
                    <h1 class="dash-title">All orders</h1>
                </div>
                <div class="dash-header-right">
                    <a class="btn primary" th:href="@{/orders/new}">+ New order</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(orders)}" class="empty-state">No orders yet.</div>

            <div th:if="${!#lists.isEmpty(orders)}" class="record-list mobile-only">
                <article class="card subtle record-card" th:each="o : ${orders}">
                    <div class="row between wrap">
                        <div>
                            <span class="kpi-card-label">Waybill</span>
                            <strong class="insight-big" th:text="${o.waybillNo}" style="margin:0;">WB123</strong>
                        </div>
                        <span class="badge" th:if="${curfoxEnabled}" th:classappend="' badge-' + ${o.curfoxSyncStatus.name()}"
                              th:text="${o.curfoxSyncStatus}"></span>
                    </div>
                    <div class="record-grid">
                        <div class="record-field">
                            <span class="record-label">Date</span>
                            <span class="record-value" th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </div>
                        <div class="record-field">
                            <span class="record-label">Customer</span>
                            <span class="record-value" th:text="${o.customerName}"></span>
                        </div>
                        <div class="record-field">
                            <span class="record-label">Phone</span>
                            <span class="record-value" th:text="${o.primaryPhone}"></span>
                        </div>
                        <div class="record-field">
                            <span class="record-label">Items</span>
                            <span class="record-value" th:text="${#lists.size(o.items)}"></span>
                        </div>
                        <div class="record-field">
                            <span class="record-label">Selling</span>
                            <span class="record-value" th:text="'LKR ' + ${o.totalSellingPrice}"></span>
                        </div>
                        <div class="record-field">
                            <span class="record-label">Net profit</span>
                            <span class="record-value profit-cell" th:text="'LKR ' + ${o.netProfit}"></span>
                        </div>
                    </div>
                    <div class="row wrap" style="margin-top: 1rem;">
                        <a class="btn secondary" th:href="@{/orders/{id}(id=${o.id})}" style="flex:1;">View order</a>
                        <form method="post" th:action="@{/orders/{id}/delete(id=${o.id})}" style="display:inline; flex:1;" onsubmit="return confirm('Are you sure you want to delete this order?');">
                            <button type="submit" class="btn subtle" style="width: 100%;">Delete</button>
                        </form>
                    </div>
                </article>
            </div>

            <div class="desktop-only table-wrap" th:if="${!#lists.isEmpty(orders)}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Waybill</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Items</th>
                        <th>Selling</th>
                        <th>Net profit</th>
                        <th th:if="${curfoxEnabled}">Courier</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${o.waybillNo}" style="font-weight: 600;"></td>
                        <td th:text="${o.customerName}"></td>
                        <td th:text="${o.primaryPhone}"></td>
                        <td th:text="${#lists.size(o.items)}"></td>
                        <td th:text="'LKR ' + ${o.totalSellingPrice}"></td>
                        <td class="profit-cell" th:text="'LKR ' + ${o.netProfit}"></td>
                        <td th:if="${curfoxEnabled}">
                            <span class="badge" th:classappend="' badge-' + ${o.curfoxSyncStatus.name()}"
                                  th:text="${o.curfoxSyncStatus}"></span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: flex-end;">
                                <a th:href="@{/orders/{id}(id=${o.id})}" class="btn secondary" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">View</a>
                                <form method="post" th:action="@{/orders/{id}/delete(id=${o.id})}" style="display:inline; margin:0;" onsubmit="return confirm('Delete this order? This action cannot be undone.');">
                                    <button type="submit" class="delete-button">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/theme.js}"></script>
<script>
    // For sidebar nav items to be marked active dynamically based on URL (simple method)
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(link => {
        if(currentPath.includes(link.getAttribute('href'))) {
            link.classList.add('active');
        }
    });
</script>
</body>
</html>

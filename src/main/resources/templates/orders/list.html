<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAREDI.COM - Orders</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        (function () {
            try {
                const stored = localStorage.getItem('bedsheet-theme');
                const theme = stored === 'dark' || stored === 'light'
                    ? stored
                    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (e) {
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>
</head>
<body>
<div th:replace="~{fragments/nav :: main}"></div>

<main class="container">
    <p class="success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <section class="card">
        <div class="row between">
            <h2>All orders</h2>
            <a class="btn primary" th:href="@{/orders/new}">+ New order</a>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="empty-state">No orders yet.</div>

        <div th:if="${!#lists.isEmpty(orders)}" class="record-list mobile-only">
            <article class="card subtle record-card" th:each="o : ${orders}">
                <div class="row between wrap">
                    <div>
                        <span class="kpi-label">Waybill</span>
                        <strong class="insight-value" th:text="${o.waybillNo}">WB123</strong>
                    </div>
                    <span class="badge" th:if="${curfoxEnabled}" th:classappend="' badge-' + ${o.curfoxSyncStatus.name()}"
                          th:text="${o.curfoxSyncStatus}"></span>
                </div>
                <div class="record-grid">
                    <div class="record-field">
                        <span class="record-label">Date</span>
                        <span class="record-value" th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    <div class="record-field">
                        <span class="record-label">Customer</span>
                        <span class="record-value" th:text="${o.customerName}"></span>
                    </div>
                    <div class="record-field">
                        <span class="record-label">Phone</span>
                        <span class="record-value" th:text="${o.primaryPhone}"></span>
                    </div>
                    <div class="record-field">
                        <span class="record-label">Items</span>
                        <span class="record-value" th:text="${#lists.size(o.items)}"></span>
                    </div>
                    <div class="record-field">
                        <span class="record-label">Selling</span>
                        <span class="record-value" th:text="'LKR ' + ${o.totalSellingPrice}"></span>
                    </div>
                    <div class="record-field">
                        <span class="record-label">Net profit</span>
                        <span class="record-value" th:text="'LKR ' + ${o.netProfit}"></span>
                    </div>
                </div>
                <div class="record-actions">
                    <a class="btn secondary" th:href="@{/orders/{id}(id=${o.id})}">View order</a>
                    <form th:action="@{/orders/{id}/delete(id=${o.id})}" method="post" onsubmit="return confirm('Delete this order permanently?');">
                        <button type="submit" class="btn subtle">Delete</button>
                    </form>
                </div>
            </article>
        </div>

        <div class="desktop-only table-wrap" th:if="${!#lists.isEmpty(orders)}">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Waybill</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Items</th>
                    <th>Selling</th>
                    <th>Net profit</th>
                    <th th:if="${curfoxEnabled}">Courier</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${o.waybillNo}"></td>
                    <td th:text="${o.customerName}"></td>
                    <td th:text="${o.primaryPhone}"></td>
                    <td th:text="${#lists.size(o.items)}"></td>
                    <td th:text="'LKR ' + ${o.totalSellingPrice}"></td>
                    <td th:text="'LKR ' + ${o.netProfit}"></td>
                    <td th:if="${curfoxEnabled}">
                        <span class="badge" th:classappend="' badge-' + ${o.curfoxSyncStatus.name()}"
                              th:text="${o.curfoxSyncStatus}"></span>
                    </td>
                    <td>
                        <div class="record-actions">
                            <a class="btn secondary" th:href="@{/orders/{id}(id=${o.id})}">View</a>
                            <form th:action="@{/orders/{id}/delete(id=${o.id})}" method="post" onsubmit="return confirm('Delete this order permanently?');">
                                <button type="submit" class="btn subtle">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>

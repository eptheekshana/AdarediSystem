# TiDB Configuration Example
# Copy this to application-tidb.properties or set as environment variables

# Database Connection
spring.datasource.url=jdbc:mysql://YOUR_TIDB_HOST:4000/bedsheet_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_TIDB_USERNAME
spring.datasource.password=YOUR_TIDB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# TiDB specific settings (optional)
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Application Configuration
spring.application.name=adaredi-orders
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=true

# Curfox Configuration (existing)
curfox.enabled=${CURFOX_ENABLED:false}
curfox.api-base-url=${CURFOX_API_BASE_URL:https://v1.api.curfox.com}
curfox.lists-api-base-url=${CURFOX_LISTS_API_BASE_URL:https://v2-lists.api.curfox.com/api}
curfox.tenant=${CURFOX_TENANT:royalexpress}
curfox.email=${CURFOX_EMAIL:}
curfox.password=${CURFOX_PASSWORD:}
curfox.merchant-business-id=${CURFOX_MERCHANT_BUSINESS_ID:}
curfox.merchant-business-name=${CURFOX_MERCHANT_BUSINESS_NAME:}
curfox.origin-city-name=${CURFOX_ORIGIN_CITY_NAME:}
curfox.origin-state-name=${CURFOX_ORIGIN_STATE_NAME:}
curfox.auto-sync-on-create=${CURFOX_AUTO_SYNC:true}

